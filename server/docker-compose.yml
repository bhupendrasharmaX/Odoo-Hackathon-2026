version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/transitops?schema=public
      - JWT_SECRET=transitops-production-secret-key-2026
      - JWT_REFRESH_SECRET=transitops-production-refresh-secret-key-2026
      - SMS_PROVIDER=console
      - PORT=5000
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: transitops
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d transitops"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
